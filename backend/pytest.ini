[pytest]
# Ajoute backend/ au sys.path pour que `from app.main import app` fonctionne
# de la meme facon en local (Windows) et sur le runner CI (Linux).
# Sans cette ligne, le runner CI echoue avec ModuleNotFoundError: No module named 'app'.
pythonpath = .

# Repertoire de decouverte des tests (sous app/ pour coller a l'architecture)
testpaths = app/tests

# Verbosite et format des tracebacks
addopts = -v --tb=short
